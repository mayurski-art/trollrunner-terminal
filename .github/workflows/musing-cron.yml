name: Trigger terminal musing

# Generates a new "still turning this over" note every couple hours — see
# app/api/musing-cron/route.ts. Independent from broadcast-cron.yml's
# endpoint (that one drives the public X-post drafts).
#
# Actual scheduling now lives in an external pinger (cron-job.org) hitting
# /api/musing-cron directly — GitHub Actions' `schedule:` trigger is
# best-effort and was landing up to ~50min late. workflow_dispatch stays as
# a manual "run now" fallback from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/musing-cron
        run: |
          status=$(curl -s -o /dev/stderr -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://terminal.trollrunner.net/api/musing-cron)
          echo "HTTP status: $status"
          if [ "$status" -ge 300 ]; then
            exit 1
          fi
