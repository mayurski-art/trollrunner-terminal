name: Trigger terminal broadcast

# Actual scheduling now lives in an external pinger (cron-job.org) hitting
# /api/cron directly — GitHub Actions' `schedule:` trigger is best-effort
# and was landing 5-50min late (no timing guarantee, see GH Actions docs).
# workflow_dispatch stays as a manual "run now" fallback from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        run: |
          status=$(curl -s -o /dev/stderr -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://terminal.trollrunner.net/api/cron)
          echo "HTTP status: $status"
          if [ "$status" -ge 300 ]; then
            exit 1
          fi
